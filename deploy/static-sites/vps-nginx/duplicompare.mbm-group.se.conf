# nginx site for duplicompare.mbm-group.se (AlmaLinux: /etc/nginx/conf.d/). certbot --nginx adds the SSL block.
server {
    server_name duplicompare.mbm-group.se;
    location / {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 80;
}
