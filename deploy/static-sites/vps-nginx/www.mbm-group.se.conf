# nginx site for www.mbm-group.se: 301 to the apex (AlmaLinux: /etc/nginx/conf.d/). Live copy incl. the certbot SSL block.
server {
    server_name www.mbm-group.se;
    return 301 https://mbm-group.se$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.mbm-group.se/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.mbm-group.se/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.mbm-group.se) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.mbm-group.se;
    return 404; # managed by Certbot


}