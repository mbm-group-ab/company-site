# One server block per site; the host nginx passes the original Host header through.
server {
    listen 80 default_server;
    server_name mbm-group.se;
    root /srv/company-site;
    index index.html;
    error_page 404 /public/404.html;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name disk-recovery-tool.mbm-group.se;
    root /srv/disk-recovery-tool;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    server_name duplicompare.mbm-group.se;
