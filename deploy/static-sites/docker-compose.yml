# Serves the three static MBM sites from the VPS (moved off Firebase Hosting on 2026-10-10).
# Host nginx terminates TLS per domain (vps-nginx/*.conf) and proxies here.
services:
  static-sites:
    mem_limit: 256m  # checkup 2026-11-14: ~2x peak use; a leak can't starve the VPS
    image: nginx:1.27-alpine
    container_name: static-sites
    restart: unless-stopped
    ports:
      - "127.0.0.1:5090:80"
    volumes:
      - ./sites:/srv:ro,z
      - ./sites.conf:/etc/nginx/conf.d/default.conf:ro,z
